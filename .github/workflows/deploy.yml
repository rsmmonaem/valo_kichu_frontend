name: Deploy Valokichu

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: valokichu-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: https://backend.valokichu.com
        run: npm run build

      - name: Prepare Artifact
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -r .next/standalone/. deploy/

          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          if [ -d public ]; then
            cp -r public deploy/public
          fi

      - name: Create Archive
        run: |
          tar -czf valokichu.tar.gz -C deploy .

      - name: Upload Archive
        uses: appleboy/scp-action@master
        with:
          host: rsmmonaem.me
          username: root
          password: RsmMonaem66@@##
          source: "valokichu.tar.gz"
          target: "/tmp"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: rsmmonaem.me
          username: root
          password: RsmMonaem66@@##
          script: |
            sudo /usr/local/bin/valokichu-deploy /tmp/valokichu.tar.gz